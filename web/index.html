<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Goa · Panjim (3D)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink: #ece4cf; --night: #0a1020; --lamp: #f2b441; --spirit: #9fe8d6; --muted: #9a9484; }
    html, body { margin: 0; height: 100%; background: #0a1020; overflow: hidden; font-family: Mukta, system-ui, sans-serif; color: var(--ink); }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    .hud { position: fixed; pointer-events: none; font-size: 13px; text-shadow: 0 1px 2px rgba(0, 0, 0, .7); }
    #stats { top: 12px; left: 14px; line-height: 1.4; }
    #stats b { color: var(--lamp); font-size: 18px; }
    #help { bottom: 12px; left: 14px; color: var(--muted); max-width: 60ch; }
    #place { top: 12px; left: 50%; transform: translateX(-50%); font-size: 15px; background: rgba(10, 16, 32, .6); padding: 4px 12px; border-radius: 6px; }
    .btns { position: fixed; right: 14px; bottom: 14px; display: flex; gap: 8px; }
    .btns button { font: 600 15px Mukta, sans-serif; color: var(--ink); background: rgba(10, 16, 32, .75); border: 1px solid rgba(236, 228, 207, .3); border-radius: 999px; width: 44px; height: 44px; cursor: pointer; touch-action: manipulation; }
    #stats .bar { display: inline-block; width: 110px; height: 8px; margin-left: 6px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; vertical-align: middle; }
    #stats .bar i { display: block; height: 100%; }
    #objective { top: 44px; left: 50%; transform: translateX(-50%); max-width: min(90vw, 60ch); text-align: center; color: var(--lamp); font-weight: 600; }
    #say { left: 50%; bottom: 76px; transform: translateX(-50%); max-width: min(90vw, 56ch); background: rgba(10,16,32,.82); padding: 8px 14px; border-radius: 8px; font-size: 15px; white-space: pre-line; opacity: 0; transition: opacity .4s; }
    #perf { top: 12px; right: 14px; color: var(--muted); font-size: 11px; }
    #map { position: fixed; right: 14px; top: 32px; width: 170px; height: 170px; border-radius: 50%; border: 2px solid rgba(236,228,207,.4); cursor: pointer; transition: all .25s; }
    #map.big { border-radius: 10px; width: min(92vw, 900px); height: min(70vh, 480px); right: 50%; transform: translateX(50%); top: 70px; z-index: 5; }
    .act { position: fixed; left: 14px; bottom: 44px; display: flex; gap: 8px; }
    .act button { font: 600 13px Mukta, sans-serif; color: var(--ink); background: rgba(10,16,32,.75); border: 1px solid rgba(236,228,207,.3); border-radius: 999px; padding: 0 12px; height: 40px; cursor: pointer; touch-action: manipulation; }
    @media (max-width: 700px) { #help { display: none; } #map { width: 120px; height: 120px; } .act { bottom: 70px; } }
    #stats .bar { display: inline-block; width: 110px; height: 8px; margin-left: 6px; background: rgba(255,255,255,.15); border-radius: 4px; overflow: hidden; vertical-align: middle; }
    #stats .bar i { display: block; height: 100%; }
    #objective { top: 44px; left: 50%; transform: translateX(-50%); max-width: min(90vw, 60ch); text-align: center; color: var(--lamp); font-weight: 600; }
    #say { left: 50%; bottom: 76px; transform: translateX(-50%); max-width: min(90vw, 56ch); background: rgba(10,16,32,.82); padding: 8px 14px; border-radius: 8px; font-size: 15px; white-space: pre-line; opacity: 0; transition: opacity .4s; }
    #perf { top: 12px; right: 14px; color: var(--muted); font-size: 11px; }
    #map { position: fixed; right: 14px; top: 32px; width: 170px; height: 170px; border-radius: 50%; border: 2px solid rgba(236,228,207,.4); cursor: pointer; transition: all .25s; }
    #map.big { border-radius: 10px; width: min(92vw, 900px); height: min(70vh, 480px); right: 50%; transform: translateX(50%); top: 70px; z-index: 5; }
    .act { position: fixed; left: 14px; bottom: 44px; display: flex; gap: 8px; flex-wrap: wrap; }
    .act button { font: 600 13px Mukta, sans-serif; color: var(--ink); background: rgba(10,16,32,.75); border: 1px solid rgba(236,228,207,.3); border-radius: 999px; padding: 0 12px; height: 40px; cursor: pointer; touch-action: manipulation; }
    @media (max-width: 700px) { #help { display: none; } #map { width: 120px; height: 120px; } .act { bottom: 70px; } }
    .vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(30,15,0,.28) 100%); }
    #places { position: fixed; inset: 6vh 50% auto auto; transform: translateX(50%); width: min(94vw, 560px); max-height: 80vh; display: none; flex-direction: column; background: rgba(14,20,36,.95); border: 1px solid rgba(236,228,207,.3); border-radius: 12px; z-index: 6; }
    #places.open { display: flex; }
    #places .ph { padding: 14px 16px 8px; position: relative; } #places h2 { margin: 0; font-size: 20px; color: var(--lamp); } #places .ph span { color: var(--muted); font-size: 13px; }
    #places .x { position: absolute; right: 10px; top: 10px; background: none; border: 0; color: var(--ink); font-size: 18px; cursor: pointer; }
    #places .pl { overflow: auto; padding: 4px 10px 12px; }
    #places .pl button { display: block; width: 100%; text-align: left; background: rgba(255,255,255,.04); border: 1px solid transparent; border-radius: 8px; color: var(--ink); padding: 8px 10px; margin: 4px 0; cursor: pointer; font: 14px Mukta, sans-serif; }
    #places .pl button:hover, #places .pl button.on { border-color: var(--spirit); } #places .pl b { display: block; font-size: 15px; } #places .pl em { color: var(--muted); font-weight: 400; font-style: normal; font-size: 12px; } #places .pl span { color: #cfc8b4; font-size: 13px; }
    #places .prow button[data-i] { width: auto; min-width: 0; } #places .prow button[data-go] { width: auto; text-align: center; color: var(--lamp); border-color: rgba(242,180,65,.4); }
    #arrow { position: fixed; left: 0; top: 0; display: none; pointer-events: none; text-align: center; color: var(--spirit); text-shadow: 0 1px 3px #000; font-weight: 700; }
    #arrow i { display: block; font-style: normal; font-size: 28px; } #arrow span { font-size: 13px; background: rgba(10,16,32,.7); padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
    #stick { position: fixed; display: none; width: 110px; height: 110px; margin: -55px 0 0 -55px; border-radius: 50%; border: 2px solid rgba(236,228,207,.45); background: rgba(10,16,32,.25); pointer-events: none; z-index: 4; }
    #stick i { position: absolute; left: 33px; top: 33px; width: 44px; height: 44px; border-radius: 50%; background: rgba(236,228,207,.55); }
    .btns button { touch-action: none; }
    #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; background: #24305e; z-index: 50; }
      /* messages you can read: solid card, bigger text; on phones at the top, clear of the thumbs and the buttons */
    #say { background: rgba(12,10,22,.95); border: 1px solid rgba(242,194,48,.55); box-shadow: 0 4px 18px rgba(0,0,0,.45); font-size: 16.5px; line-height: 1.45; padding: 10px 16px; z-index: 5; }
    #objective { background: rgba(12,10,22,.7); padding: 3px 10px; border-radius: 6px; }
    @media (max-width: 700px) {
      #place { display: none; }   /* the place name also shows in the task line and on the map */
      #objective { top: 74px; font-size: 13px; max-width: calc(100vw - 150px); left: 8px; transform: none; text-align: left; }
      #say { top: 116px; bottom: auto; left: 8px; right: 8px; transform: none; max-width: none; font-size: 16px; }
    }
</style>
</head>
<body>
  <div id="app"></div>
  <!-- required by the Open Database License: the map is built from OpenStreetMap data -->
  <a id="credit" href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener" style="position:fixed;left:50%;bottom:4px;transform:translateX(-50%);z-index:30;font:500 11px system-ui,sans-serif;color:#fff;background:rgba(0,0,0,.38);padding:2px 8px;border-radius:6px;text-decoration:none;white-space:nowrap">Map data © OpenStreetMap contributors<span class="long"> · Elevation: NASA SRTM</span></a>
  <style>
  #places .sec { color: var(--muted); font-size: 12px; letter-spacing: .05em; text-transform: uppercase; margin: 10px 4px 2px; }
  #places .pl em { display: block; }
  #mapX { position: fixed; z-index: 8; display: none; top: 76px; right: max(14px, calc(50% - min(46vw, 450px) + 8px)); font: 600 14px Mukta, sans-serif; color: #ece4cf; background: rgba(10,16,32,.9); border: 1px solid rgba(236,228,207,.4); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
  body.whats #map.big { top: 8px; left: 8px; right: auto; width: calc(100vw - 16px); height: 42vh; transform: none; border-radius: 12px; }
  body.whats #places { top: calc(42vh + 14px); bottom: 8px; left: 8px; right: auto; width: calc(100vw - 16px); max-height: none; transform: none; inset: calc(42vh + 14px) auto 8px 8px; }
  body.whats #evcard { bottom: auto !important; top: calc(42vh - 150px); }
  body.whats .act, body.whats .btns, body.whats #objective, body.whats #say, body.whats #arrow { visibility: hidden; }
  @media (min-width: 900px) {
    body.whats #map.big { width: calc(62vw - 16px); height: calc(100vh - 16px); }
    body.whats #places { inset: 8px 8px 8px auto; width: calc(38vw - 8px); }
    body.whats #evcard { top: auto; bottom: 20px !important; left: 31vw !important; }
  }
  #town { top: 206px; right: 14px; width: 170px; text-align: center; font-weight: 700; color: var(--lamp); font-size: 13px; }
  body.whats #town, #map.big ~ #town { display: none; }
  @media (max-width: 700px) { #town { top: 154px; width: 120px; font-size: 12px; } }
  .act button.hot { border-color: #5fd8c8; color: #0a1020; background: #5fd8c8; }
  /* phones: one compact row of actions along the bottom (the ones you use most first), four slim camera buttons in a
     column on the right, the map credit small and out of the way */
  @media (max-width: 700px) {
    #credit { bottom: 4px !important; left: 8px !important; transform: none !important; font-size: 9px !important; opacity: .65; padding: 1px 6px !important; }
    #credit .long { display: none; }
    #perf { display: none; }
    .act { left: 6px; right: 6px; bottom: 20px; gap: 6px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .act::-webkit-scrollbar { display: none; }
    .act button { height: 38px; padding: 0 11px; font-size: 13px; flex: 0 0 auto; }
    #bTalk { order: 1; } #bLift { order: 2; } #bWhat { order: 3; } #bShare { order: 5; }
    #bTalk, #bLift { font-size: 14px; padding: 0 15px; }
    .btns { flex-direction: column; right: 6px; bottom: 70px; gap: 6px; }
    .btns button { width: 38px; height: 38px; font-size: 14px; }
    #bHome, #bTiltD, #bTiltU { display: none; }
    #say { font-size: 14.5px !important; padding: 8px 12px !important; top: auto !important; bottom: 70px !important; left: 8px !important; right: 54px !important; }
    #stats { background: rgba(10,16,32,.72); padding: 3px 10px; border-radius: 999px; top: 10px; left: 8px; }
    #objective { top: 44px !important; left: 8px !important; width: calc(100vw - 156px); max-width: none !important; box-sizing: border-box; font-size: 12.5px !important; line-height: 1.3; }
    #map { z-index: 6; touch-action: manipulation; }
    #town { z-index: 6; }
    .btns { bottom: 160px; }
  }
</style>
  <div id="loading">Loading Goa…</div>
  <div class="hud" id="stats"></div>
  <div class="hud" id="place"></div>
  <div class="hud" id="objective"></div>
  <div class="hud" id="say"></div>
  <div class="hud" id="perf"></div>
  <canvas id="map" title="Map of Panjim (tap to open)"></canvas>
  <div class="hud" id="objective"></div>
  <div class="hud" id="say"></div>
  <div class="hud" id="perf"></div>
  <canvas id="map" title="Map of Panjim (tap to open)"></canvas>
  <div class="hud" id="help">WASD: walk · Shift: run · click, then move the mouse: look around (Esc frees it) · Q/E, Z/X: turn · wheel/±: zoom · T: talk · F: lift · L: torch · [ ]: tilt · 0: reset view · P: places · M: map · N: skip to night/day</div>
  <button id="mapX" aria-label="Close the map">✕ Close</button><div id="town" class="hud"></div><div id="stick"><i></i></div><div id="places"></div><div id="arrow"></div>
  <div class="act"><button id="bWhat">What's on</button><button id="bShare" style="border-color:rgba(95,216,200,.6);color:#a8f0e6">Share your story</button><button id="bTalk">Talk</button><button id="bLift">Lift</button></div>
  <div class="vignette"></div>
  <div class="btns"><button id="bHome" aria-label="Reset the view" title="Reset the view (0)">⌂</button><button id="bTiltD" aria-label="Tilt down">⤓</button><button id="bTiltU" aria-label="Tilt up">⤒</button><button id="bL" aria-label="Turn left">⟲</button><button id="bR" aria-label="Turn right">⟳</button><button id="bOut" aria-label="Zoom out">−</button><button id="bIn" aria-label="Zoom in">+</button></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
